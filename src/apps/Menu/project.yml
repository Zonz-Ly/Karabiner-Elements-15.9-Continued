name: Karabiner-Menu

options:
  xcodeVersion: "16.2"
  minimumXcodeGenVersion: "2.42.0"

packages:
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    exactVersion: 1.0.4
  Collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.1.4

targets:
  Karabiner-Menu:
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.pqrs.Karabiner-Menu
      CODE_SIGN_ENTITLEMENTS: ''
      CODE_SIGN_IDENTITY: '-'
      CODE_SIGN_STYLE: Manual
      HEADER_SEARCH_PATHS:
        - ../../lib/libkrbn/include
      OTHER_LDFLAGS:
        - -L../../lib/libkrbn/build/Release
        - -lkrbn
      OTHER_SWIFT_FLAGS: '-warnings-as-errors'
      SWIFT_OBJC_BRIDGING_HEADER: src/Bridging-Header.h
      SYSTEM_HEADER_SEARCH_PATHS:
        - ../../../vendor/vendor/include
      DEAD_CODE_STRIPPING: 'YES'
      SWIFT_VERSION: '6.0'
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: src
        compilerFlags:
          - -Wall
          - -Werror
      - path: ../share/swift
        compilerFlags:
          - -Wall
          - -Werror
      - path: ../../../vendor/vendor/src/pqrs/osx/process_info
      - path: ../../../vendor/vendor/src/pqrs/osx/workspace
      - path: Resources
        excludes:
          - .gitignore
          - '*.plist.in'
      - path: ../../../files/icons/KarabinerElements.icns
    dependencies:
      - package: AsyncAlgorithms
      - sdk: libc++.tbd
